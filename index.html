<!DOCTYPE html>
<html lang="es" data-mode="auto" data-theme="turquoise" data-mapmode="aerial">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00BFA6" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>HAMAKA — Gestión de hamacas</title>
  <style>
    /* Paletas y modos */
    :root{
      /* Paleta base (turquoise) */
      --sea:#0EB1C7; --sea-2:#6FD6E3; --shore:#F9E2B0; --sand:#F4E5C3; --dune:#E8D5A9;
      --accent:#00BFA6; --accent-2:#1576EA; --accent-3:#FF6B6B;
      --ink:#0F172A; --ink-2:#334155; --ink-3:#64748B;
      --bg:#F7FAFC; --card:#ffffff; --muted:#E6E8EF;
      --ok:#16A34A; --warn:#F59E0B;
      --radius:16px; --shadow: 0 10px 30px rgba(0,0,0,.08); --blur: saturate(140%) blur(10px);
      --tile-min:clamp(72px, 22vw, 110px);
      --tab-size: 24px;
    }
    [data-theme="sunset"]{
      --sea:#FF8C6A; --sea-2:#FFD1C3; --shore:#FFE3B0; --sand:#F8E6C8; --dune:#EED4A7;
      --accent:#FF6B6B; --accent-2:#FF9F1C; --accent-3:#1565C0;
    }
    [data-theme="sand"]{
      --sea:#3DB2FF; --sea-2:#A7E0FF; --shore:#FFE6B3; --sand:#F7EAD9; --dune:#E6D2AE;
      --accent:#F59E0B; --accent-2:#10B981; --accent-3:#2563EB;
    }
    /* Modo oscuro manual (o auto) */
    @media (prefers-color-scheme: dark){ :root[data-mode="auto"]{ --bg:#0B1220; --card:#0F172A; --ink:#E5E7EB; --ink-2:#CBD5E1; --ink-3:#94A3B8; --muted:#263045; --shadow: 0 14px 40px rgba(0,0,0,.5) } }
    :root[data-mode="dark"]{ --bg:#0B1220; --card:#0F172A; --ink:#E5E7EB; --ink-2:#CBD5E1; --ink-3:#94A3B8; --muted:#263045; --shadow: 0 14px 40px rgba(0,0,0,.5) }
    :root[data-mode="light"]{ --bg:#F7FAFC; --card:#ffffff; --ink:#0F172A; --ink-2:#334155; --ink-3:#64748B; --muted:#E6E8EF }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.25 -apple-system, system-ui, Segoe UI, Inter, Roboto, Arial, sans-serif;}

    /* Fondo “playa” (vista aérea) */
    .ocean{ position:fixed; inset:-40vh -15vw auto -15vw; height:50vh; pointer-events:none; z-index:-1;
      background:
        radial-gradient(1200px 400px at 50% 90%, color-mix(in oklab, var(--sea) 35%, transparent), transparent 60%),
        linear-gradient(140deg, color-mix(in oklab, var(--sea-2) 40%, transparent), transparent 55%);
      filter: blur(28px) saturate(120%); animation: swell 18s ease-in-out infinite alternate;
    }
    @keyframes swell{ from{ transform: translateY(-4%) } to{ transform: translateY(3%) } }

    header{
      position:sticky; top:0; z-index:10; backdrop-filter: var(--blur);
      background: color-mix(in oklab, var(--card) 80%, transparent);
      border-bottom:1px solid var(--muted);
      padding: .6rem max(1rem, env(safe-area-inset-left));
    }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:.75rem }
    .logo{ display:flex; align-items:center; gap:.6rem; font-weight:800; letter-spacing:.2px }
    .logo svg{ width:28px; height:28px }
    .chip{ padding:.35rem .65rem; border-radius:999px; background:var(--shore); color:#3b3b3b; font-size:.75rem }
    .actions{ display:flex; gap:.4rem; align-items:center }
    .icon-btn{
      height:36px; width:36px; display:inline-grid; place-items:center;
      border-radius:12px; border:1px solid var(--muted); background:var(--card); cursor:pointer;
      transition: transform .15s ease, background .2s ease; box-shadow: none;
    }
    .icon-btn:active{ transform: translateY(1px) scale(.98) }
    .icon-btn svg{ width:18px; height:18px }
    .searchbar{ margin-top:.5rem }
    .searchbar input{
      width:100%; padding:.7rem .9rem; border-radius:14px; border:1px solid var(--muted);
      background:var(--card); color:var(--ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
    }

    main{ padding: 1rem; padding-bottom: calc(86px + env(safe-area-inset-bottom)); max-width:1100px; margin:0 auto }
    .kpis{ display:flex; gap:.6rem; flex-wrap:wrap; margin-bottom:.7rem }
    .kpi{ flex:1; min-width:140px; display:flex; align-items:center; justify-content:space-between; gap:.4rem; background:var(--card);
      border:1px solid var(--muted); border-radius:14px; padding:.55rem .8rem; box-shadow: var(--shadow); }

    /* Head de mapa */
    .map-head{ display:flex; gap:.6rem; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:.6rem }
    .pill{ padding:.35rem .65rem; border-radius:999px; font-size:.8rem; border:1px solid var(--muted); background:var(--card) }
    .btn{ appearance:none; border:0; border-radius:14px; padding:.7rem 1rem; font-weight:700; cursor:pointer; transition: transform .15s ease, filter .15s ease, background .2s ease; box-shadow: var(--shadow) }
    .btn.primary{ background:var(--accent); color:#fff }
    .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--muted); box-shadow:none }

    /* Vista playa */
    .beach{
      position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--muted);
      background:
        radial-gradient(800px 200px at 50% -40px, var(--sea) 35%, transparent 40%),
        linear-gradient(180deg, color-mix(in oklab, var(--sand) 85%, var(--shore) 15%), var(--dune));
      box-shadow: var(--shadow);
      padding: 16px; /* margen interior para la orilla */
    }
    .beach::before{ /* orilla ondulada */
      content:""; position:absolute; inset:0; height:32%; left:0; right:0; top:0; pointer-events:none;
      background: conic-gradient(from 200deg at 50% 100%, rgba(255,255,255,.55), rgba(255,255,255,.0) 30%);
      mix-blend-mode: soft-light;
    }
    .boardwalk{ /* pasarela inferior */
      position:absolute; left:0; right:0; bottom:0; height:24px; background:
        repeating-linear-gradient(90deg, #B08968 0 16px, #A37B5E 16px 17px);
      opacity:.35; pointer-events:none;
    }

    /* Grid y Aérea */
    .grid{ display:grid; gap:.6rem; grid-template-columns: repeat(var(--cols), minmax(var(--tile-min), 1fr)); }
    @media (max-width: 640px){
      .grid{ grid-template-columns: repeat(auto-fill, minmax(min(120px, 33vw), 1fr)); }
    }
    .aerial{ position:relative; height:auto; min-height: 60vh; }
    .aerial .lounger{ position:absolute }

    /* Hamaca */
    .lounger{
      isolation:isolate; display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height: clamp(86px, 14vw, 132px); padding-top:6px;
      border-radius:16px; border:1px solid var(--muted); background:var(--card); overflow:hidden; user-select:none;
      box-shadow: 0 1px 0 rgba(0,0,0,.05);
      transition: transform .18s ease, box-shadow .18s ease, border-color .2s ease, background .2s ease, outline-color .2s ease;
      will-change: transform;
    }
    .lounger:hover{ transform: translateY(-2px) }
    .lounger .id{ font-size:.9rem; font-weight:800; letter-spacing:.2px }
    .status-dot{ position:absolute; top:8px; right:8px; width:12px; height:12px; border-radius:50%; box-shadow: 0 0 0 3px rgba(0,0,0,.06) }
    .zone-badge{ position:absolute; top:8px; left:8px; font-size:.62rem; padding:.15rem .35rem; border-radius:999px; border:1px solid var(--muted); background:rgba(255,255,255,.7); backdrop-filter: blur(6px) }
    .people{ position:absolute; bottom:8px; left:8px; display:flex; align-items:center; gap:.2rem; font-size:.7rem; font-weight:700; background:rgba(255,255,255,.7); border:1px solid var(--muted); border-radius:999px; padding:.15rem .4rem; }
    .people svg{ width:12px; height:12px }
    .lounger .svg-lounger{ width:52%; opacity:.95 }
    .lounger.free{ border-color: rgba(16,185,129,.35) }
    .lounger.reserved{ background: linear-gradient(180deg, color-mix(in oklab, var(--accent-3) 10%, var(--card)), color-mix(in oklab, var(--accent-3) 5%, var(--card))); border-color: color-mix(in oklab, var(--accent-3) 50%, var(--muted)) }
    .lounger.occupied{ background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 12%, var(--card)), color-mix(in oklab, var(--accent) 5%, var(--card))); border-color: color-mix(in oklab, var(--accent) 55%, var(--muted)) }
    .lounger.maint{ background: linear-gradient(180deg, rgba(148,163,184,.18), rgba(148,163,184,.08)); border-style:dashed }
    .lounger.flash{ animation: pop .28s cubic-bezier(.2,.9,.2,1) }
    @keyframes pop{ from{ transform: scale(.96); box-shadow: 0 0 0 rgba(0,0,0,0) } to{ transform: scale(1); box-shadow: var(--shadow) } }
    .ripple{ position:absolute; border-radius:50%; transform: scale(0); background: rgba(255,255,255,.7); mix-blend-mode: overlay; animation: ripple .6s ease-out; pointer-events:none }
    @keyframes ripple{ to{ transform: scale(6); opacity:0 } }

    .card{ background:var(--card); border:1px solid var(--muted); border-radius: var(--radius); padding:1rem; box-shadow: var(--shadow) }
    .row{ display:flex; gap:.7rem; align-items:center; flex-wrap:wrap }
    .row > *{ flex:1 }

    /* Nav inferior: solo iconos en mobile */
    nav{ position:fixed; left:0; right:0; bottom:0; z-index:10; padding: .5rem max(1rem, env(safe-area-inset-left));
      padding-bottom: calc(.5rem + env(safe-area-inset-bottom)); background: color-mix(in oklab, var(--card) 78%, transparent); backdrop-filter: var(--blur); border-top:1px solid var(--muted) }
    .tabs{ display:flex; gap:.5rem; justify-content:space-between }
    .tab{ flex:1; display:flex; align-items:center; justify-content:center; gap:.4rem; background:transparent; color:var(--ink);
      border:1px solid var(--muted); border-radius:14px; min-height:50px; cursor:pointer; }
    .tab svg{ width:var(--tab-size); height:var(--tab-size) }
    .tab.active{ background: var(--accent-2); color:#fff; border-color: transparent }
    .tab span{ display:inline }
    @media (max-width:640px){ .tab span{ display:none } .tab{ min-height:54px } }

    section{ display:none }
    section.active{ display:block; animation: fade .22s ease }
    @keyframes fade{ from{ opacity:0; transform: translateY(6px) } }

    .sheet{ position:fixed; left:0; right:0; bottom:-100%; background:var(--card);
      border-top-left-radius:22px; border-top-right-radius:22px; box-shadow: 0 -20px 60px rgba(0,0,0,.35); padding:1rem; z-index:20;
      transition: transform .34s cubic-bezier(.2,.8,.2,1), bottom .34s; transform: translateY(100%); max-height: 92vh; overflow:auto;
    }
    .sheet.active{ bottom:0; transform: translateY(0) }
    .sheet .handle{ width:56px; height:5px; background:var(--muted); border-radius:999px; margin:.2rem auto 1rem }
    label{ font-size:.85rem; color:var(--ink-3); display:block; margin-bottom:.25rem }
    input, select, textarea{
      width:100%; border:1px solid var(--muted); border-radius:12px; padding:.65rem .75rem; background:var(--card); color:var(--ink);
    }

    .toast{ position:fixed; left:50%; transform: translateX(-50%); bottom: calc(94px + env(safe-area-inset-bottom)); background:var(--ink); color:white; padding:.7rem 1rem; border-radius:12px; opacity:0; pointer-events:none }
    .toast.show{ opacity:1; animation: toast .2s ease; }
    @keyframes toast{ from{ transform: translate(-50%, 8px); opacity:0 } }

    @media (prefers-reduced-motion: reduce){
      .ocean{ animation: none }
      .lounger:hover{ transform:none }
      .lounger.flash{ animation:none }
    }
  </style>
</head>
<body>
  <div class="ocean" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="logo" aria-label="Hamaka">
        <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00BFA6"/><stop offset="1" stop-color="#1576EA"/></linearGradient></defs>
          <path d="M8 42c10 0 18-8 24-8s14 8 24 8" fill="none" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
          <path d="M20 20l-6 18M44 20l6 18" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
          <path d="M16 26c8 2 24 2 32 0" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
        </svg>
        HAMAKA <span class="chip" id="envChip">v1.2</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="paletteBtn" title="Cambiar paleta" aria-label="Cambiar paleta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a9 9 0 100 18 3 3 0 003-3 2 2 0 00-2-2h-1a2 2 0 01-2-2 3 3 0 013-3h1a3 3 0 003-3 3 3 0 00-3-3z" stroke-width="1.8"/></svg>
        </button>
        <button class="icon-btn" id="modeBtn" title="Modo claro/oscuro" aria-label="Cambiar modo">
          <svg id="modeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3a9 9 0 109 9c0-4.97-4.03-9-9-9z" stroke-width="1.8"/></svg>
        </button>
        <button class="icon-btn" id="langBtn" aria-label="Cambiar idioma">ES</button>
        <button class="icon-btn" id="installBtn" title="Instalar" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="searchbar">
      <input id="globalSearch" type="search" placeholder="Buscar cliente o hamaca…" />
    </div>
  </header>

  <main>
    <div class="kpis">
      <div class="kpi"><span>Ocupación</span> <b id="kpiOcc">0%</b></div>
      <div class="kpi"><span>Reservas hoy</span> <b id="kpiRes">0</b></div>
      <div class="kpi"><span>Ingresos est.</span> <b id="kpiRev">0€</b></div>
    </div>

    <section id="view-map" class="active">
      <div class="map-head">
        <div class="row" style="flex:2; align-items:center">
          <div class="pill" id="datePill"></div>
          <select id="slotSelect"></select>
          <select id="viewMode">
            <option value="aerial">Vista aérea</option>
            <option value="grid">Grid</option>
          </select>
        </div>
        <div class="row" style="flex:1; justify-content:flex-end">
          <button class="btn ghost" id="demoBtn">Modo demo</button>
          <button class="btn primary" id="newResBtn">Nueva reserva</button>
        </div>
      </div>

      <div class="beach">
        <div class="boardwalk" aria-hidden="true"></div>
        <!-- contenedor dinámico: grid o aerial -->
        <div id="mapWrap" class="grid" style="--cols:10"></div>
      </div>
    </section>

    <section id="view-res">
      <div class="card">
        <div class="row">
          <div class="search"><input id="searchRes" placeholder="Buscar reserva…" /></div>
          <button class="btn ghost" id="exportJSON">Export JSON</button>
          <button class="btn ghost" id="exportCSV">Export CSV</button>
        </div>
        <div id="resList" style="margin-top:.6rem"></div>
      </div>
    </section>

    <section id="view-clients">
      <div class="card">
        <div class="row">
          <div class="search"><input id="searchClients" placeholder="Buscar cliente…" /></div>
          <button class="btn primary" id="addClientBtn">Nuevo cliente</button>
        </div>
        <div id="clientList" style="margin-top:.6rem"></div>
      </div>
    </section>

    <section id="view-reports">
      <div class="card">
        <h3 style="margin:0 0 .6rem 0">Reportes rápidos</h3>
        <div class="row">
          <input type="date" id="reportDate">
          <button class="btn primary" id="calcReport">Calcular</button>
        </div>
        <div id="reportOut" style="margin-top:.6rem"></div>
      </div>
    </section>

    <section id="view-settings">
      <div class="card">
        <h3 style="margin:0 0 .6rem 0">Plano y configuración</h3>
        <div class="row">
          <div><label>Filas</label><input type="number" id="rows" min="1" max="50" value="6"></div>
          <div><label>Columnas</label><input type="number" id="cols" min="1" max="50" value="10"></div>
          <div><label>Hamacas por sombrilla</label><input type="number" id="perUmb" min="1" max="6" value="2"></div>
        </div>
        <div class="row">
          <div>
            <label>Zonas (por filas, JSON)</label>
            <textarea id="zones" rows="3" placeholder='[{"nombre":"Primera línea","fromRow":1,"toRow":1},{"nombre":"Central","fromRow":2,"toRow":3},{"nombre":"Tranquila","fromRow":4,"toRow":6}]'></textarea>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Temporadas (JSON)</label>
            <textarea id="seasons" rows="3" placeholder='[{"nombre":"Alta","inicio":"2025-06-15","fin":"2025-09-15"}]'></textarea>
          </div>
          <div>
            <label>Tarifas (JSON)</label>
            <textarea id="rates" rows="3" placeholder='[{"tipo":"hamaca","temporada":"Alta","dia":"laborable","€/hora":5},{"tipo":"sombrilla","temporada":"Alta","dia":"laborable","€/hora":3}]'></textarea>
          </div>
        </div>
        <div class="row">
          <button class="btn primary" id="applyCfg">Aplicar</button>
          <button class="btn ghost" id="resetCfg">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <nav aria-label="Navegación inferior">
    <div class="tabs">
      <button class="tab active" data-tab="map" aria-label="Mapa">
        <!-- Map icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6zM9 3v15M15 6v15" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span data-i18n="map">Mapa</span>
      </button>
      <button class="tab" data-tab="res" aria-label="Reservas">
        <!-- Calendar icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="17" rx="3" stroke-width="1.8"/><path d="M8 2v4M16 2v4M3 10h18" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-i18n="bookings">Reservas</span>
      </button>
      <button class="tab" data-tab="clients" aria-label="Clientes">
        <!-- Users icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke-width="1.8"/><circle cx="10" cy="8" r="4" stroke-width="1.8"/></svg>
        <span data-i18n="clients">Clientes</span>
      </button>
      <button class="tab" data-tab="reports" aria-label="Reportes">
        <!-- Chart icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 20V6M10 20V10M16 20V4M22 20H2" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span data-i18n="reports">Reportes</span>
      </button>
      <button class="tab" data-tab="settings" aria-label="Ajustes">
        <!-- Settings icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V22a2 2 0 01-4 0v-.07a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.07a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.07a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.07a1.65 1.65 0 00-1.51 1z" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="settings">Ajustes</span>
      </button>
    </div>
  </nav>

  <!-- Sheet reserva -->
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <form id="resForm">
      <input type="hidden" id="resId">
      <div class="row">
        <div><label data-i18n="date">Fecha</label><input type="date" id="resDate"></div>
        <div><label>Inicio</label><input type="time" id="resStart" step="1800"></div>
        <div><label>Fin</label><input type="time" id="resEnd" step="1800"></div>
      </div>
      <div class="row">
        <div><label>Hamaca</label><select id="resSeat"></select></div>
        <div><label>Cliente</label><select id="resClient"></select></div>
      </div>
      <div class="row">
        <div><label>Personas</label><input id="resPeople" type="number" min="1" max="6" value="2"></div>
        <div><label>Precio estimado</label><input id="resPrice" readonly></div>
      </div>
      <div class="row">
        <div><label>Notas</label><input id="resNotes" placeholder="Opcional"></div>
      </div>
      <div class="row">
        <button class="btn primary" type="submit">Guardar</button>
        <button class="btn ghost" type="button" id="checkInBtn">Check-in</button>
        <button class="btn ghost" type="button" id="cancelBtn">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ===== i18n =====
    const I18N = {
      es: { map:"Mapa", bookings:"Reservas", clients:"Clientes", reports:"Reportes", settings:"Ajustes", date:"Fecha",
        saved:"Reserva guardada", created:"Reserva creada", updated:"Reserva actualizada",
        checkin_ok:"Check-in realizado", cancel_ok:"Reserva cancelada", demo_loaded:"Demo cargada",
        install:"Instalar", newBooking:"Nueva reserva", allDay:"Todo el día", aerial:"Vista aérea", grid:"Grid" },
      en: { map:"Map", bookings:"Bookings", clients:"Customers", reports:"Reports", settings:"Settings", date:"Date",
        saved:"Booking saved", created:"Booking created", updated:"Booking updated",
        checkin_ok:"Check-in complete", cancel_ok:"Booking cancelled", demo_loaded:"Demo loaded",
        install:"Install", newBooking:"New booking", allDay:"All day", aerial:"Aerial", grid:"Grid" }
    };
    let lang = localStorage.getItem('hamaka-lang') || 'es';
    const t = k => (I18N[lang] && I18N[lang][k]) || k;

    // ===== State =====
    const state = {
      config: {
        rows: 6, cols: 10, perUmbrella: 2,
        zones: [{nombre:"Primera línea", fromRow:1, toRow:1},{nombre:"Central", fromRow:2, toRow:3},{nombre:"Tranquila", fromRow:4, toRow:6}],
        seasons: [
          {nombre:"Alta", inicio:"2025-06-15", fin:"2025-09-15"},
          {nombre:"Baja", inicio:"2025-01-01", fin:"2025-06-14"}
        ],
        rates: [
          {tipo:"hamaca", temporada:"Alta", dia:"laborable", "€/hora":5},
          {tipo:"hamaca", temporada:"Alta", dia:"festivo", "€/hora":6},
          {tipo:"hamaca", temporada:"Baja", dia:"laborable", "€/hora":4},
          {tipo:"sombrilla", temporada:"Alta", dia:"laborable", "€/hora":3}
        ]
      },
      hamacas: [], reservas: [], clientes: [],
      activeDate: new Date(),
      viewSlot: null, // null = All day
      mapMode: (document.documentElement.dataset.mapmode || 'aerial'),
      slotMinutes: 60,
      promptEvent: null,
      theme: localStorage.getItem('hamaka-theme') || document.documentElement.dataset.theme || 'turquoise',
      mode: localStorage.getItem('hamaka-mode') || document.documentElement.dataset.mode || 'auto'
    };

    // ===== Utils =====
    const $ = (s, ctx=document)=>ctx.querySelector(s);
    const $all = (s, ctx=document)=>Array.from(ctx.querySelectorAll(s));
    const fmtDate = d=>new Date(d).toISOString().slice(0,10);
    const isWeekend = d=>[0,6].includes(new Date(d).getDay());
    const uid = (p='')=> p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3);
    const clamp = (n,min,max)=>Math.max(min, Math.min(max,n));
    const money = (n)=> new Intl.NumberFormat(lang, {style:'currency', currency:'EUR'}).format(n||0);

    function save(){ localStorage.setItem('hamaka-data', JSON.stringify({ ...state, promptEvent:undefined })); }
    function load(){
      const s = localStorage.getItem('hamaka-data');
      if(!s) return;
      try {
        const {config, hamacas, reservas, clientes, activeDate} = JSON.parse(s);
        state.config = config||state.config;
        state.hamacas = hamacas||[];
        state.reservas = reservas||[];
        state.clientes = clientes||[];
        state.activeDate = activeDate ? new Date(activeDate) : new Date();
      } catch(e){ console.warn('No se pudo cargar estado', e) }
    }

    // ===== Theming =====
    function applyTheme(name){
      document.documentElement.dataset.theme = name;
      state.theme = name; localStorage.setItem('hamaka-theme', name);
    }
    function cyclePalette(){
      const list = ['turquoise','sunset','sand'];
      const idx = list.indexOf(state.theme);
      applyTheme(list[(idx+1)%list.length]);
    }
    function applyMode(mode){
      document.documentElement.dataset.mode = mode;
      state.mode = mode; localStorage.setItem('hamaka-mode', mode);
    }
    function toggleMode(){
      const next = state.mode==='light' ? 'dark' : state.mode==='dark' ? 'auto' : 'light';
      applyMode(next);
      $('#modeIcon').innerHTML = next==='dark'
        ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke-width="1.8"></path>'
        : next==='light'
          ? '<circle cx="12" cy="12" r="5" stroke-width="1.8"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-width="1.8" stroke-linecap="round"></path>'
          : '<path d="M12 3a9 9 0 109 9c0-4.97-4.03-9-9-9z" stroke-width="1.8"></path>';
    }

    // ===== Datos hamacas =====
    function genHamacas(){
      const {rows, cols, zones} = state.config;
      const list = [];
      for(let r=1; r<=rows; r++){
        for(let c=1; c<=cols; c++){
          const id = `H-${r}-${c}`;
          const zona = zones.find(z=> r>=z.fromRow && r<=z.toRow)?.nombre || "General";
          list.push({ id, nombre: `${String.fromCharCode(64+r)}${c}`, posicion:{fila:r,col:c}, zona, estado:'libre', notas:'' });
        }
      }
      state.hamacas = list;
    }

    // ===== Render =====
    function setLang(l){ lang = l; localStorage.setItem('hamaka-lang', l); $('#langBtn').textContent = l.toUpperCase(); $all('[data-i18n]').forEach(el=> el.textContent = t(el.dataset.i18n)); }

    function loungerIcon(){
      return `<svg class="svg-lounger" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2E8F0"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient></defs>
        <rect x="18" y="10" width="28" height="44" rx="6" fill="url(#lg)" stroke="#CBD5E1" stroke-width="2"/>
        <g stroke="#CBD5E1" stroke-width="1">
          <line x1="20" y1="16" x2="46" y2="16"/><line x1="20" y1="22" x2="46" y2="22"/>
          <line x1="20" y1="28" x2="46" y2="28"/><line x1="20" y1="34" x2="46" y2="34"/>
          <line x1="20" y1="40" x2="46" y2="40"/><line x1="20" y1="46" x2="46" y2="46"/>
        </g>
      </svg>`;
    }

    function zoneShort(z){
      if(!z) return 'GEN';
      const lower = z.toLowerCase();
      if(lower.includes('primera')) return '1ª';
      if(lower.includes('segunda')) return '2ª';
      if(lower.includes('central')) return 'CTR';
      if(lower.includes('tranquil')) return 'TRQ';
      return z.slice(0,3).toUpperCase();
    }

    function peopleBadge(n=0){
      if(!n || n<1) return '';
      return `<div class="people" title="${n} personas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke-width="1.6"/><circle cx="10" cy="8" r="3.5" stroke-width="1.6"/></svg>
        ${n}
      </div>`;
    }

    function renderGrid(){
      const wrap = $('#mapWrap');
      wrap.className = state.mapMode==='aerial' ? 'aerial' : 'grid';
      wrap.style.setProperty('--cols', state.config.cols);
      wrap.innerHTML = '';
      if(!state.hamacas.length) genHamacas();
      const day = fmtDate(state.activeDate);
      const resDay = state.reservas.filter(r=>r.fecha===day && r.estado!=='cancelada');

      if(state.mapMode==='grid'){
        // usar grid
        for(const h of state.hamacas){
          wrap.appendChild(makeLounger(h, resDay));
        }
      } else {
        // Vista aérea: posicionamiento absoluto siguiendo filas/columnas, con ligera curvatura
        const padX = 16, padY = 20;
        const cols = state.config.cols, rows = state.config.rows;
        const W = wrap.clientWidth || wrap.offsetWidth || 320;
        const tileW = Math.min(120, Math.max(82, (W - padX*2) / Math.min(cols, Math.floor(W/100)) - 8));
        const gap = 10;
        const tileH = tileW * 0.8;
        const beachHeight = rows*tileH + (rows-1)*gap + padY*2 + 40;
        wrap.style.minHeight = beachHeight+'px';

        for(const h of state.hamacas){
          const el = makeLounger(h, resDay);
          // posicionar
          const r = h.posicion.fila-1, c = h.posicion.col-1;
          // curvatura suave: las filas altas están un poco más cerca del mar (top), con ligera onda
          const curve = Math.sin((c/cols)*Math.PI) * 6; // ondulación de línea de costa
          const top = padY + r*(tileH+gap) - r*2 + curve;
          const left = padX + c*(tileW+gap);
          Object.assign(el.style, { top: top+'px', left: left+'px', width: tileW+'px', height: tileH+'px' });
          wrap.appendChild(el);
        }
      }
      updateKPIs();
    }

    function makeLounger(h, resDay){
      const btn = document.createElement('button');
      btn.type="button";
      const cls = 'lounger ' + cssState(h, resDay);
      btn.className = cls;
      btn.setAttribute('data-id', h.id);
      const res = resDay.find(r=> r.hamacas?.includes(h.id) && (state.viewSlot ? overlaps(state.viewSlot, r.franja, fmtDate(state.activeDate)) : true));
      const personas = res?.personas || 0;
      btn.innerHTML = `
        <span class="status-dot" style="background:${statusDot(cls)}"></span>
        <span class="zone-badge">${zoneShort(h.zona)}</span>
        ${loungerIcon()}
        <div class="id">${h.nombre}</div>
        ${peopleBadge(personas)}
      `;
      btn.addEventListener('click', (e)=> { ripple(e); openSheetFor(h.id, res?.id); });
      return btn;
    }

    function statusDot(className){
      if(className.includes('occupied')) return 'var(--accent)';
      if(className.includes('reserved')) return 'var(--accent-3)';
      if(className.includes('maint')) return '#94A3B8';
      return 'var(--ok)';
    }

    function cssState(h, resList){
      if(h.estado==='mantenimiento') return 'maint';
      const list = resList.filter(r=> r.hamacas?.includes(h.id));
      if(!list.length) return 'free';
      const slot = state.viewSlot;
      const match = slot ? list.some(r=> overlaps(slot, r.franja, fmtDate(state.activeDate))) : list.length>0;
      if(!match) return 'free';
      if(list.some(r=> r.estado==='ocupada')) return 'occupied';
      return 'reserved';
    }

    function timeRange(str){ const [i,f] = str.split('-'); return {inicio:i, fin:f}; }
    function overlaps(a,b,dateStr){
      const s1=new Date(`${dateStr}T${a.inicio}`), e1=new Date(`${dateStr}T${a.fin}`);
      const s2=new Date(`${dateStr}T${b.inicio}`), e2=new Date(`${dateStr}T${b.fin}`);
      return s1<e2 && s2<e1;
    }
    function ripple(e){
      const el = e.currentTarget;
      const r = document.createElement('span'); r.className='ripple';
      const rect = el.getBoundingClientRect();
      r.style.left = (e.clientX - rect.left)+'px'; r.style.top = (e.clientY - rect.top)+'px';
      const max = Math.max(rect.width, rect.height); r.style.width = r.style.height = max+'px';
      el.appendChild(r); setTimeout(()=> r.remove(), 600);
    }

    function updateKPIs(){
      const d = fmtDate(state.activeDate);
      const res = state.reservas.filter(r=> r.fecha===d && r.estado!=='cancelada');
      const occNow = state.hamacas.filter(h=> cssState(h, res)!=='free').length;
      const occPct = state.hamacas.length ? Math.round(occNow/state.hamacas.length*100) : 0;
      $('#kpiOcc').textContent = occPct+'%';
      $('#kpiRes').textContent = res.length;
      const rev = res.reduce((acc,r)=> acc + (r.precio||0), 0);
      $('#kpiRev').textContent = money(rev);
    }

    function renderSlots(){
      const sel = $('#slotSelect');
      sel.innerHTML = '';
      const optAll = document.createElement('option'); optAll.value = 'ALL'; optAll.textContent = t('allDay'); sel.appendChild(optAll);
      for(let h=8; h<=20; h++){
        const end = h + state.slotMinutes/60;
        const value = `${String(h).padStart(2,'0')}:00-${String(end).padStart(2,'0')}:00`;
        const opt = document.createElement('option'); opt.value = value; opt.textContent = value; sel.appendChild(opt);
      }
      sel.value = 'ALL';
      $('#datePill').textContent = new Date(state.activeDate).toLocaleDateString(lang);
      // Vista
      $('#viewMode').value = state.mapMode;
    }

    // ===== Sheet (Reserva) =====
    function openSheetFor(hamacaId=null, editId=null){
      const sh = $('#sheet');
      const f = $('#resForm');
      f.reset();
      $('#resId').value = '';
      $('#resDate').value = fmtDate(state.activeDate);
      $('#resStart').value = '09:00'; $('#resEnd').value = '13:00';
      $('#resPeople').value = 2;
      renderSeatOptions(hamacaId);
      renderClientOptions();

      if(editId){
        const r = state.reservas.find(x=>x.id===editId);
        if(r){
          $('#resId').value = r.id;
          $('#resDate').value = r.fecha;
          $('#resStart').value = r.franja.inicio;
          $('#resEnd').value = r.franja.fin;
          $('#resSeat').value = r.hamacas[0];
          $('#resClient').value = r.clienteId;
          $('#resNotes').value = r.notas||'';
          $('#resPeople').value = r.personas||2;
        }
      }
      calcPrice();
      sh.classList.add('active');
    }
    function closeSheet(){ $('#sheet').classList.remove('active') }

    function renderSeatOptions(selected){
      const sel = $('#resSeat');
            sel.innerHTML = state.hamacas.map(h=> `<option value="${h.id}" ${h.id===selected?'selected':''}>${h.nombre}</option>`).join('');
    }

    function renderClientOptions(){
      const sel = $('#resClient');
      sel.innerHTML = '<option value="">— Nuevo cliente —</option>' +
        state.clientes.map(c=> `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    // Precio: por horas (tarifa hamaca) + extra sombrilla si se completa el par
    function calcPrice(){
      const d = $('#resDate').value || fmtDate(state.activeDate);
      const inicio = $('#resStart').value, fin = $('#resEnd').value;
      const horas = Math.max(0, (new Date(`${d}T${fin}`)-new Date(`${d}T${inicio}`))/3600000);
      const temporada = seasonName(d);
      const dia = isWeekend(d) ? 'festivo' : 'laborable';
      const th = state.config.rates.find(r=> r.tipo==='hamaca' && r.temporada===temporada && r.dia===dia);
      const ts = state.config.rates.find(r=> r.tipo==='sombrilla' && r.temporada===temporada && r.dia===dia);
      const base = (th?th["€/hora"]:4) * horas;
      const seatId = $('#resSeat').value;
      const isPair = seatId && Number(seatId.split('-')[2]) % state.config.perUmbrella === 0;
      const extra = isPair && ts ? ts["€/hora"]*horas : 0;
      const price = Math.max(0, Math.round((base + extra)*100)/100);
      $('#resPrice').value = price.toFixed(2)+'€';
      return price;
    }

    function seasonName(dateStr){
      const d = new Date(dateStr);
      for(const s of state.config.seasons){
        const i = new Date(s.inicio), f = new Date(s.fin);
        if(d>=i && d<=f) return s.nombre;
      }
      return 'Baja';
    }

    // ===== CRUD Reserva =====
    $('#resForm').addEventListener('input', (e)=> {
      if(['resDate','resStart','resEnd','resSeat'].includes(e.target.id)) calcPrice();
    });

    $('#resForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const id = $('#resId').value || uid('R-');

      // cliente
      let clienteId = $('#resClient').value;
      if(!clienteId){
        const nombre = prompt('Nombre del cliente:','Cliente demo');
        if(!nombre) return;
        const c = { id: uid('C-'), nombre };
        state.clientes.push(c); clienteId = c.id;
      }

      const reserva = {
        id,
        fecha: $('#resDate').value || fmtDate(state.activeDate),
        franja: {inicio:$('#resStart').value, fin:$('#resEnd').value},
        hamacas: [$('#resSeat').value],
        clienteId,
        personas: clamp(parseInt($('#resPeople').value)||1, 1, 6),
        precio: parseFloat(($('#resPrice').value||'').replace(/[^\d.]/g,''))||0,
        estado:'reservada',
        notas: $('#resNotes').value||''
      };

      // solape simple
      const overlap = state.reservas.find(r=> r.id!==id && r.fecha===reserva.fecha && r.hamacas.some(h=> reserva.hamacas.includes(h)) && overlaps(reserva.franja, r.franja, reserva.fecha) && r.estado!=='cancelada');
      if(overlap){ toast('Solape detectado: elige otra franja u otra hamaca'); return; }

      const ix = state.reservas.findIndex(r=> r.id===id);
      if(ix>=0) state.reservas[ix]=reserva; else state.reservas.push(reserva);
      save(); renderAll(); closeSheet(); toast(ix>=0? t('updated') : t('created'));
      flashLounger(reserva.hamacas[0]);
    });

    $('#checkInBtn').addEventListener('click', ()=>{
      const id = $('#resId').value;
      if(!id) return;
      const r = state.reservas.find(x=>x.id===id);
      if(!r) return;
      r.estado = 'ocupada';
      save(); renderAll(); toast(t('checkin_ok')); flashLounger(r.hamacas[0]);
    });

    $('#cancelBtn').addEventListener('click', ()=>{
      const id = $('#resId').value;
      if(!id) { closeSheet(); return; }
      const r = state.reservas.find(x=>x.id===id);
      if(!r) return;
      r.estado = 'cancelada';
      save(); renderAll(); closeSheet(); toast(t('cancel_ok'));
    });

    function flashLounger(id){
      const el = document.querySelector(`.lounger[data-id="${id}"]`);
      if(!el) return; el.classList.add('flash'); setTimeout(()=> el.classList.remove('flash'), 400);
    }

    // ===== Listados =====
    function renderReservas(){
      const box = $('#resList');
      const q = ($('#searchRes').value||'').toLowerCase();
      const list = state.reservas
        .filter(r=>{
          const c = state.clientes.find(x=>x.id===r.clienteId)?.nombre?.toLowerCase()||'';
          const h = r.hamacas.map(id=> state.hamacas.find(x=>x.id===id)?.nombre).join(',').toLowerCase();
          return [r.fecha, c, h, r.estado].some(s=> (s||'').includes(q));
        })
        .sort((a,b)=> a.fecha.localeCompare(b.fecha)|| a.franja.inicio.localeCompare(b.franja.inicio));

      box.innerHTML = list.map(r=>{
        const c = state.clientes.find(x=>x.id===r.clienteId)?.nombre||'—';
        const h = r.hamacas.map(id=> state.hamacas.find(x=>x.id===id)?.nombre).join(', ');
        return `<div class="card" style="margin:.5rem 0; display:flex; align-items:center; justify-content:space-between; gap:.8rem">
          <div><b>${r.fecha}</b> ${r.franja.inicio}-${r.franja.fin} · <b>${h}</b> · ${c} · 👥 ${r.personas||1}</div>
          <div class="row" style="flex:0 0 auto">
            <span class="pill">${r.estado}</span>
            <button class="btn ghost" data-edit="${r.id}">Editar</button>
          </div>
        </div>`;
      }).join('') || '<div class="card">Sin reservas</div>';

      $all('[data-edit]').forEach(b=> b.addEventListener('click', ()=> editReserva(b.dataset.edit)));
    }

    function editReserva(id){
      const r = state.reservas.find(x=>x.id===id);
      if(!r) return;
      openSheetFor(r.hamacas[0], r.id);
    }

    function renderClientes(){
      const box = $('#clientList');
      const q = ($('#searchClients').value||'').toLowerCase();
      const list = state.clientes
        .filter(c=> (c.nombre||'').toLowerCase().includes(q))
        .sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
      box.innerHTML = list.map(c=> `<div class="card" style="margin:.4rem 0; display:flex; justify-content:space-between; align-items:center">
        <div>${c.nombre}</div>
        <div class="row" style="flex:0 0 auto">
          <button class="btn ghost" data-book="${c.id}">Reservar</button>
        </div>
      </div>`).join('') || '<div class="card">Sin clientes</div>';

      $all('[data-book]').forEach(b=> b.addEventListener('click', ()=> { openSheetFor(); renderClientOptions(); $('#resClient').value = b.dataset.book; }));
    }

    // ===== Reportes =====
    $('#calcReport').addEventListener('click', ()=>{
      const date = $('#reportDate').value || fmtDate(new Date());
      const res = state.reservas.filter(r=> r.fecha===date && r.estado!=='cancelada');
      const ocp = new Set(res.flatMap(r=>r.hamacas)).size;
      const rev = res.reduce((a,r)=>a+(r.precio||0),0);
      $('#reportOut').innerHTML = `<div class="card">Ocupación (únicas): <b>${ocp}</b> / ${state.hamacas.length}<br/> Reservas: <b>${res.length}</b><br/> Ingresos est.: <b>${rev.toFixed(2)}€</b></div>`;
    });

    // ===== Export =====
    $('#exportJSON').addEventListener('click', ()=> download('hamaka-data.json', JSON.stringify({hamacas:state.hamacas, reservas:state.reservas, clientes:state.clientes}, null, 2), 'application/json'));
    $('#exportCSV').addEventListener('click', ()=>{
      const rows = [['id','fecha','inicio','fin','hamacas','cliente','personas','precio','estado']];
      for(const r of state.reservas){
        rows.push([r.id, r.fecha, r.franja.inicio, r.franja.fin, r.hamacas.join('|'), (state.clientes.find(c=>c.id===r.clienteId)?.nombre)||'', r.personas||1, r.precio, r.estado]);
      }
      const csv = rows.map(r=> r.map(x=> `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
      download('reservas.csv', csv, 'text/csv;charset=utf-8;');
    });
    function download(name, content, type){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([content], {type}));
      a.download = name; a.click();
      setTimeout(()=> URL.revokeObjectURL(a.href), 800);
    }

    // ===== Settings =====
    $('#applyCfg').addEventListener('click', ()=>{
      try{
        state.config.rows = clamp(parseInt($('#rows').value)||6, 1, 50);
        state.config.cols = clamp(parseInt($('#cols').value)||10, 1, 50);
        state.config.perUmbrella = clamp(parseInt($('#perUmb').value)||2, 1, 6);
        state.config.zones = JSON.parse($('#zones').value || '[]');
        state.config.seasons = JSON.parse($('#seasons').value || '[]');
        state.config.rates = JSON.parse($('#rates').value || '[]');
        genHamacas(); save(); renderAll(); toast('Configuración aplicada');
      }catch(e){ toast('Error en JSON de configuración'); }
    });
    $('#resetCfg').addEventListener('click', ()=> { localStorage.removeItem('hamaka-data'); location.reload(); });

    // ===== Tabs =====
    $all('.tab').forEach(b=> b.addEventListener('click', ()=>{
      $all('.tab').forEach(x=> x.classList.toggle('active', x===b));
      $all('main section').forEach(s=> s.classList.remove('active'));
      $('#view-'+b.dataset.tab).classList.add('active');
      if(b.dataset.tab==='map') renderGrid();
      if(b.dataset.tab==='res') renderReservas();
      if(b.dataset.tab==='clients') renderClientes();
    }));

    // ===== Buscador global =====
    $('#globalSearch').addEventListener('input', ()=>{
      const q = $('#globalSearch').value.toLowerCase().trim();
      if(!q) return;
      // 1) intenta hamaca
      const foundSeat = state.hamacas.find(h=> h.nombre.toLowerCase().includes(q));
      if(foundSeat){ highlight(foundSeat.id); return; }
      // 2) sugiere cliente
      const foundClient = state.clientes.find(c=> (c.nombre||'').toLowerCase().includes(q));
      if(foundClient){
        // abre clientes para que lo vean rápido
        document.querySelector('[data-tab="clients"]').click();
        $('#searchClients').value = foundClient.nombre.split(' ')[0];
        renderClientes();
      }
    });
    function highlight(id){
      const el = document.querySelector(`.lounger[data-id="${id}"]`); if(!el) return;
      el.style.outline='2px solid var(--accent-2)'; el.style.outlineOffset='2px';
      setTimeout(()=> { el.style.outline=''; el.style.outlineOffset=''; }, 900);
    }

    // ===== Demo =====
    $('#demoBtn').addEventListener('click', loadDemo);
    function loadDemo(){
      state.clientes = [{id:'C-1', nombre:'Laura Pérez'},{id:'C-2', nombre:'John Smith'},{id:'C-3', nombre:'Ana Ruiz'}];
      state.config.rows=6; state.config.cols=12;
      state.config.zones=[{nombre:'Primera línea',fromRow:1,toRow:1},{nombre:'Central',fromRow:2,toRow:3},{nombre:'Tranquila',fromRow:4,toRow:6}];
      genHamacas();
      const today = fmtDate(new Date());
      state.reservas = [
        {id:'R-1', fecha:today, franja:{inicio:'09:00',fin:'12:00'}, hamacas:['H-1-3'], clienteId:'C-1', personas:2, precio:18, estado:'reservada'},
        {id:'R-2', fecha:today, franja:{inicio:'10:00',fin:'14:00'}, hamacas:['H-1-4'], clienteId:'C-2', personas:3, precio:24, estado:'ocupada'}
      ];
      save(); renderAll(); toast(t('demo_loaded'));
      flashLounger('H-1-3'); flashLounger('H-1-4');
    }

    // ===== Slots y vista =====
    $('#slotSelect').addEventListener('change', (e)=>{
      const v = e.target.value;
      state.viewSlot = (v==='ALL') ? null : timeRange(v);
      renderGrid();
    });
    $('#viewMode').addEventListener('change', (e)=>{
      state.mapMode = e.target.value;
      document.documentElement.dataset.mapmode = state.mapMode;
      // re-render con layout adecuado
      renderGrid();
    });

    // ===== Header actions =====
    $('#paletteBtn').addEventListener('click', ()=> { cyclePalette(); renderGrid(); });
    $('#modeBtn').addEventListener('click', ()=> { toggleMode(); });
    $('#langBtn').addEventListener('click', ()=> { setLang(lang==='es'?'en':'es'); renderSlots(); renderGrid(); renderReservas(); renderClientes(); });

    // ===== PWA Install =====
    window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); state.promptEvent = e; $('#installBtn').style.display='inline-grid'; });
    $('#installBtn').addEventListener('click', async ()=>{
      if(state.promptEvent){ state.promptEvent.prompt(); const choice = await state.promptEvent.userChoice; if(choice.outcome==='accepted') $('#installBtn').style.display='none'; }
    });

    // ===== Service Worker (si existe sw.js) =====
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=> {
        navigator.serviceWorker.register('./sw.js').then(reg=>{
          if(reg.waiting){ showUpdate(reg.waiting); }
          reg.addEventListener('updatefound', ()=> {
            const newW = reg.installing;
            newW.addEventListener('statechange', ()=> {
              if(newW.state === 'installed' && navigator.serviceWorker.controller){ showUpdate(newW); }
            });
          });
          let refreshing=false;
          navigator.serviceWorker.addEventListener('controllerchange', ()=> { if(refreshing) return; refreshing=true; location.reload(); });
        }).catch(()=>{ /* opcional: sin SW */ });
      });
    }
    function showUpdate(worker){
      const div = document.createElement('div');
      div.className='toast show';
      div.textContent = 'Nueva versión disponible. Actualizar';
      div.style.background = 'var(--accent-2)';
      div.style.cursor='pointer';
      div.onclick = ()=> { worker.postMessage({action:'skipWaiting'}); div.remove(); };
      document.body.appendChild(div);
      setTimeout(()=> div.classList.remove('show'), 5000);
    }

    // ===== Toast =====
    function toast(msg){
      const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 2000);
    }

    // ===== Init & responsive =====
    function renderSlots(){
      const sel = $('#slotSelect');
      sel.innerHTML = '';
      const optAll = document.createElement('option'); optAll.value = 'ALL'; optAll.textContent = t('allDay'); sel.appendChild(optAll);
      for(let h=8; h<=20; h++){
        const end = h + state.slotMinutes/60;
        const value = `${String(h).padStart(2,'0')}:00-${String(end).padStart(2,'0')}:00`;
        const opt = document.createElement('option'); opt.value = value; opt.textContent = value; sel.appendChild(opt);
      }
      sel.value = 'ALL';
      $('#datePill').textContent = new Date(state.activeDate).toLocaleDateString(lang);
      $('#viewMode').value = state.mapMode;
    }

    function renderAll(){
      $('#rows').value = state.config.rows;
      $('#cols').value = state.config.cols;
      $('#perUmb').value = state.config.perUmbrella;
      $('#zones').value = JSON.stringify(state.config.zones||[], null, 2);
      $('#seasons').value = JSON.stringify(state.config.seasons||[], null, 2);
      $('#rates').value = JSON.stringify(state.config.rates||[], null, 2);
      setLang(lang);
      applyTheme(state.theme);
      applyMode(state.mode);
      renderSlots();
      renderGrid();
      renderReservas();
      renderClientes();
      $('#reportDate').value = fmtDate(new Date());
    }

    // Ajuste de icono de modo al iniciar
    (function syncModeIcon(){
      const mode = state.mode;
      const svg = mode==='dark'
        ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke-width="1.8"></path>'
        : mode==='light'
          ? '<circle cx="12" cy="12" r="5" stroke-width="1.8"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-width="1.8" stroke-linecap="round"></path>'
          : '<path d="M12 3a9 9 0 109 9c0-4.97-4.03-9-9-9z" stroke-width="1.8"></path>';
      $('#modeIcon').innerHTML = svg;
    })();

    // Debounce para re-render en cambios de tamaño (clave para vista aérea)
    let rzT;
    function handleResize(){ clearTimeout(rzT); rzT = setTimeout(()=> renderGrid(), 120); }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    // Boot
    load();
    if(!state.hamacas.length) genHamacas();
    renderAll();
  </script>
</body>
</html>
